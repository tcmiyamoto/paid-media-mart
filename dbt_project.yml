
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'paid_media_mart'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'paid_media_mart'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
 paid_media_mart:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  paid_media_mart:
    +column_types:
      campaign_id: string
    signups:
      +column_types:
        utm_source: string
        utm_medium: string
        utm_campaign: string
        revenue: numeric
    # Salesforce IDs and free-text fields are strings even when a column happens to be
    # empty or numeric-looking (ad campaign IDs in UTMs, sparse custom fields).
    sf_lead:
      +column_types:
        id: string
        master_record_id: string
        utm_source__c: string
        utm_medium__c: string
        utm_campaign__c: string
        gclid__c: string
        meeting_booked_date__c: timestamp
        meeting_held_date__c: timestamp
        converted_date: date
        converted_account_id: string
        converted_contact_id: string
        converted_opportunity_id: string
    sf_opportunity:
      +column_types:
        account_id: string
        campaign_id: string
        lead_source: string
        amount: numeric
    sf_opportunity_history:
      +column_types:
        amount: numeric
    sf_contact:
      +column_types:
        lead_source: string
    sf_campaign:
      +column_types:
        parent_id: string
        product_line__c: string
        utm_source__c: string
        utm_medium__c: string
        ad_platform__c: string
        ad_campaign_id__c: string
    sf_campaign_member:
      +column_types:
        lead_id: string
        contact_id: string
    app_trial_events:
      +column_types:
        arr: numeric
    web_sessions:
      +column_types:
        user_pseudo_id: string
        source: string
        medium: string
        campaign: string
    web_identities:
      +column_types:
        user_pseudo_id: string
