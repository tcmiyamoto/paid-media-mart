version: 2

models:
  - name: int_ad_spend__unioned
    description: "Daily campaign spend from all three ad platforms in one table. Grain: date x platform x campaign."
  - name: int_signups__channel_classified
    description: "Signups with a channel assigned from the UTM mapping table, falling back to Direct, Referral, or Other. ad_platform links paid signups to campaigns."
  - name: int_incrementality_factors
    description: "One row per test with its incrementality factor (incremental / attributed conversions), confidence range, and the window it applies to. valid_to is null for the latest test on each channel."
    columns:
      - name: test_id
        data_tests: [unique, not_null]
      - name: incrementality_factor
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 2
  - name: int_leads__channel_classified
    description: "Salesforce leads with a channel from the shared UTM mapping, falling back to Direct, Referral, or Other."
  - name: int_crm__funnel_events
    description: "One row per lead per funnel stage reached, assembled from Salesforce (lead dates, converted opportunity, stage history) and product trial events. Stage names match funnel_stage_definitions."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [lead_id, stage]
    columns:
      - name: lead_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_salesforce__lead')
                field: lead_id
      - name: event_ts
        data_tests: [not_null]
  - name: int_salesforce__campaigns
    description: "Salesforce campaigns with a channel from the shared UTM mapping and, for ad campaigns, the key to dim_campaign."
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
      - name: channel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Paid Search', 'Paid Social - Meta', 'Paid Social - LinkedIn', 'Organic Search', 'Email', 'Events', 'Direct', 'Referral']
      - name: ad_campaign_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_key
  - name: int_opportunity_stages
    description: "One row per opportunity with the first time it entered each stage, from stage history."
    columns:
      - name: opportunity_id
        data_tests: [unique, not_null]
  - name: int_opportunity_influence
    description: "One row per opportunity x campaign that influenced it: any responder on the deal (converting lead or buying committee contact) in the 90 days before the opportunity was created."
    columns:
      - name: influence_id
        data_tests: [unique, not_null]
      - name: opportunity_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_salesforce__opportunity')
                field: opportunity_id
  - name: int_lead_funnel
    description: "One row per lead with timestamps for the standard funnel stages (lead, engaged, qualified, opportunity, won, lost), mapped from motion-specific stages."
    columns:
      - name: lead_id
        data_tests: [unique, not_null]
