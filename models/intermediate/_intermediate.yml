version: 2

models:
  - name: int_ad_spend__unioned
    description: "Daily campaign spend from all three ad platforms in one table. Grain: date x platform x campaign."
  - name: int_signups__channel_classified
    description: "Signups with a channel assigned from the UTM mapping table, falling back to Direct, Referral, or Other. ad_platform links paid signups to campaigns."
  - name: int_incrementality_factors
    description: "One row per test with its incrementality factor (incremental / attributed conversions), confidence range, and the window it applies to. valid_to is null for the latest test on each channel."
    columns:
      - name: test_id
        data_tests: [unique, not_null]
      - name: incrementality_factor
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 2
  - name: int_leads__channel_classified
    description: "Leads with a channel from the shared UTM mapping, falling back to Direct, Referral, or Other."
  - name: int_lead_funnel
    description: "One row per lead with timestamps for the standard funnel stages (lead, engaged, qualified, opportunity, won, lost), mapped from motion-specific stages."
    columns:
      - name: lead_id
        data_tests: [unique, not_null]
