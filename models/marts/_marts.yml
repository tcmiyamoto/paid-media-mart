version: 2

models:
  - name: dim_channel
    columns:
      - name: channel_key
        data_tests: [unique, not_null]
      - name: channel_name
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['Paid Search', 'Paid Social - Meta', 'Paid Social - LinkedIn',
                         'Organic Search', 'Email', 'Events', 'Direct', 'Referral', 'Other']

  - name: dim_campaign
    columns:
      - name: campaign_key
        data_tests: [unique, not_null]
      - name: channel_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_key

  - name: fct_ad_spend
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [spend_date, campaign_key]
    columns:
      - name: campaign_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_key
      - name: channel_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_key
      - name: spend_usd
        data_tests: [not_null]

  - name: fct_signups
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: channel_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_key
      - name: campaign_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_key

  - name: rpt_channel_weekly
    columns:
      - name: channel_name
        data_tests: [not_null]
