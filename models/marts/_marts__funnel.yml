version: 2

models:
  - name: fct_leads
    description: "Accumulating snapshot, one row per lead, with standard funnel stage timestamps, pipeline and won ARR, and channel and campaign keys."
    columns:
      - name: lead_id
        data_tests: [unique, not_null]
      - name: channel_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_key
      - name: campaign_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_key

  - name: rpt_funnel_monthly
    description: "Cohort funnel by lead month x product line x motion x channel: spend, stage counts, pipeline, won ARR, cost per lead / qualified / won, cost per pipeline dollar."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cohort_month, product_line, motion, channel_name]

  - name: rpt_click_id_coverage
    description: "Google click ID coverage on paid search leads by entry form."
