version: 2

models:
  - name: fct_channel_incremental_cac
    description: >
      Weekly paid channel CAC on an attributed basis and an incremental basis, using the
      incrementality factor from the test registry that was valid that week. Untested channels
      keep attributed numbers only; stale factors are applied but flagged.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [week_start, channel_name]
    columns:
      - name: channel_name
        data_tests: [not_null]
      - name: factor_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['current', 'stale', 'untested']
